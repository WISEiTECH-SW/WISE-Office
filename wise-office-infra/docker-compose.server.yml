name: wise-office

services:
  database:
    container_name: wise-office-postgres
    image: postgres:15
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${POSTGRES_VOLUME}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wise-office-network

  application:
    container_name: wise-office-server
    build:
      context: ../wise-office-server
      dockerfile: Dockerfile
    image: wise-office-server:latest
    ports:
      - ${SERVER_PORT}:8080
    env_file:
      - ./.env.dev
    volumes:
      - ${IMAGE_VOLUME}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - wise-office-network
    depends_on:
      database:
        condition: service_healthy

networks:
  wise-office-network:
    name: wise-office-network
    driver: bridge